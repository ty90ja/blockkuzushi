<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ブロック崩し">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>ブロック崩し</title>
</head>
<body>
  <div id="container">
    <canvas id="gameCanvas"></canvas>
    <div id="controls">
      <button id="ballBtn" aria-label="分裂弾">
        <span class="ball-icon">◎</span>
        <span class="ball-label">分裂弾</span>
        <span class="ball-hint">左右45°に発射</span>
      </button>
      <button id="laserBtn" aria-label="レーザー砲">
        <span class="laser-icon">⚡</span>
        <span class="laser-label">レーザー砲</span>
        <span class="laser-hint">3秒長押し→波動砲</span>
        <span class="wave-charge-bar"><span id="waveChargeInner"></span></span>
      </button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
